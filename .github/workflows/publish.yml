name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify workflow runs from main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is on main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch origin main --tags
          git rev-parse "$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
      - name: Check version can be published
        uses: jfrz38/check-version-change@12828e3736f108329fe0ea7a8800966b4b2730af # v1.6.0
        with:
          file-path: package.json
          package-name: "@jfrz38/opencode-hover-preview"
          compare-source: registry
          registry: npm
          fail-on-unchanged: true
          fail-on-not-higher: true
      - name: Download package from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tgz' \
            --pattern '*.sha256' \
            --dir "$RUNNER_TEMP/npm-package"
          sha256sum --check "$RUNNER_TEMP"/npm-package/*.sha256
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ inputs.tag }}
          path: ${{ runner.temp }}/npm-package/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ inputs.tag }}
          path: ${{ runner.temp }}/npm-package
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Reverify package checksum
        working-directory: ${{ runner.temp }}/npm-package
        run: sha256sum --check ./*.sha256
      - name: Publish verified package to npm
        working-directory: ${{ runner.temp }}/npm-package
        run: npm publish ./*.tgz --access public
